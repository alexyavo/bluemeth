name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  macos:
    name: macOS (build, lint, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - name: Bundle
        run: scripts/bundle.sh
      - name: Bundle sanity
        run: |
          plutil -lint target/bluemeth.app/Contents/Info.plist
          codesign --verify --strict target/bluemeth.app
          iconutil -c iconset target/bluemeth.app/Contents/Resources/AppIcon.icns -o /tmp/AppIcon.iconset
          test -f /tmp/AppIcon.iconset/icon_512x512@2x.png
      - name: Leak check (CLI)
        run: |
          export MallocStackLogging=1
          leaks --atExit -- target/debug/bluemeth -dimsu -t 1 | tee /tmp/leaks.txt
          grep -q "0 leaks for 0 total leaked bytes" /tmp/leaks.txt

  linux-core:
    name: Linux (core + CLI compile with stub backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p bluemeth-core -p bluemeth-cli
      - run: cargo test -p bluemeth-core -p bluemeth-cli
